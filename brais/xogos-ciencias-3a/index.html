<style>
/* Xogos de Ciencias · 3º A · escuro por defecto, pensado para pantalla dixital (lonxe) e tableta */
:root {
  --bg: #f4f6f3; --sup: #ffffff; --sup2: #eef1ec; --txt: #17201a; --txt2: #4b5a50; --bor: #d5ddd6;
  --ok: #15803d; --ok-bg: #dcfce7; --mal: #b91c1c; --mal-bg: #fee2e2; --pista: #a16207; --pista-bg: #fef3c7;
  --az: #2563eb; --ve: #dc2626; --tile: #ffffff; --ac: #15803d; --sombra: 0 2px 10px rgba(0,0,0,.08);
  --r: 18px; font-size: clamp(16px, 1.15vw + 8px, 26px);
}
:root[data-theme="dark"] {
  --bg: #0f1512; --sup: #18211c; --sup2: #212c26; --txt: #eef3ef; --txt2: #a8b8ad; --bor: #2f3d35;
  --ok: #4ade80; --ok-bg: #12301f; --mal: #f87171; --mal-bg: #3a1717; --pista: #fbbf24; --pista-bg: #3a2c0b;
  --az: #60a5fa; --ve: #f87171; --tile: #f8faf7; --sombra: 0 2px 12px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--txt); font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.35; -webkit-tap-highlight-color: transparent; }
#app { max-width: 1500px; margin: 0 auto; padding: 0 16px 90px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:disabled { cursor: default; }
button:focus-visible { outline: 3px solid var(--ac); outline-offset: 3px; }
.ico { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- barra superior ---------- */
.barra { display: flex; align-items: center; gap: 14px; padding: 14px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.barra-tit { flex: 1; min-width: 0; }
.barra h1 { margin: 2px 0 0; font-size: 1.6rem; line-height: 1.1; }
.chip { display: inline-block; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--ac); }
.btn-ico { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--sup); border: 1px solid var(--bor); }
.btn-ico:hover { border-color: var(--ac); }
.progreso { width: min(260px, 22vw); height: 12px; background: var(--sup2); border-radius: 99px; overflow: hidden; }
.progreso div { height: 100%; width: 0; background: var(--ac); transition: width .4s; }
.consigna { font-size: 1.1rem; color: var(--txt2); margin: 0 0 16px; font-weight: 600; }

/* ---------- botóns ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; padding: .6em 1.1em; border-radius: 14px; background: var(--ac); color: #fff; font-weight: 800; min-height: 3rem; }
.btn.sec { background: var(--sup); color: var(--txt); border: 2px solid var(--bor); }
.btn.sec:hover:not(:disabled) { border-color: var(--ac); }
.btn.grande { font-size: 1.15rem; min-height: 3.6rem; padding: .7em 1.4em; }
.btn:disabled { opacity: .4; }
.btn.ben { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.btn.si { background: #15803d; } .btn.non { background: #b91c1c; }
.accions { display: flex; gap: 14px; flex-wrap: wrap; }
.opcions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
.opcions.col { grid-template-columns: 1fr; }

/* ---------- pictogramas ---------- */
.pic { display: block; width: 4.6rem; height: 4.6rem; background: var(--tile) center / 86% no-repeat; border-radius: 12px; }
.pic.mini { width: 1.8rem; height: 1.8rem; border-radius: 6px; }
.pic.xl { width: min(16rem, 60vw); height: min(16rem, 60vw); border-radius: 24px; }

/* ---------- portada ---------- */
.portada-barra h1 { font-size: 2.2rem; }
.trim h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: .08em; color: var(--txt2); margin: 18px 0 12px; }
.areas { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.area h3 { margin: 0 0 12px; font-size: 1.25rem; }
.ud { background: var(--sup); border: 1px solid var(--bor); border-left: 8px solid var(--ac); border-radius: var(--r); padding: 16px; margin-bottom: 16px; box-shadow: var(--sombra); }
.ud-tit { margin: 0 0 12px; color: var(--txt2); font-size: .95rem; }
.ud-tit b { color: var(--ac); margin-right: .3em; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 16px; border-radius: 14px; background: var(--sup2); border: 2px solid transparent; font-weight: 800; font-size: 1.15rem; min-height: 7rem; transition: transform .15s, border-color .15s; }
.tile .ico { width: 2rem; height: 2rem; color: var(--ac); }
.tile small { font-weight: 700; color: var(--txt2); font-size: .75rem; }
.tile:hover { border-color: var(--ac); transform: translateY(-2px); }
footer { margin-top: 30px; font-size: .75rem; color: var(--txt2); text-align: center; }

/* ---------- cartas e grupos (clasificar, cadea) ---------- */
.bandexa { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 14px; background: var(--sup); border: 1px dashed var(--bor); border-radius: var(--r); min-height: 9rem; }
.carta { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; width: 9.5rem; border-radius: 14px; background: var(--sup2); border: 3px solid transparent; font-weight: 800; text-align: center; transition: transform .15s, opacity .3s; }
.carta span { font-size: .95rem; line-height: 1.15; }
.carta:hover:not(:disabled) { transform: translateY(-2px); }
.carta.sel { border-color: var(--ac); transform: scale(1.06); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ac) 25%, transparent); }
.carta.feito { opacity: .18; transform: scale(.9); }
.grupos { display: grid; gap: 12px; margin-top: 16px; }
.grupos.g5 { grid-template-columns: repeat(5, 1fr); } .grupos.g2 { grid-template-columns: 1fr 1fr; }
.grupo { display: flex; flex-direction: column; gap: 8px; padding: 14px; min-height: 9rem; border-radius: var(--r); background: var(--sup); border: 3px solid var(--bor); text-align: left; }
.grupo:hover { border-color: var(--ac); }
.grupo.ok { border-color: color-mix(in srgb, var(--ok) 60%, var(--bor)); } .grupo.mal { border-color: color-mix(in srgb, var(--mal) 60%, var(--bor)); }
.grupo.ok .g-tit { color: var(--ok); } .grupo.mal .g-tit { color: var(--mal); }
.g-tit { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 1.05rem; }
.g-dentro { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-carta { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 700; background: var(--sup2); border-radius: 8px; padding: 3px 8px 3px 3px; animation: entra .35s; }

/* ---------- clave ---------- */
.clave { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: start; }
.misterio { display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 800; color: var(--txt2); }
.ruta { margin: 0 0 14px; padding-left: 1.3em; color: var(--txt2); }
.ruta li { margin-bottom: 4px; } .ruta b.si { color: var(--ok); } .ruta b.non { color: var(--mal); }
.pregunta { font-size: 1.7rem; font-weight: 900; margin: 6px 0 18px; }
.pregunta.def { background: var(--sup); border: 1px solid var(--bor); border-left: 8px solid var(--ac); border-radius: var(--r); padding: 22px; font-size: 1.5rem; }
.resolto { font-size: 2rem; font-weight: 900; margin-bottom: 18px; color: var(--ok); }
.resolto small { display: block; font-size: 1rem; color: var(--txt2); font-weight: 700; }

/* ---------- cadea ---------- */
.lugar { font-weight: 700; color: var(--txt2); margin: 0 0 10px; text-align: center; }
.ocos { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.oco { width: 10rem; min-height: 9.5rem; border: 3px dashed var(--bor); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 800; position: relative; }
.oco > span:only-child { font-size: 2rem; color: var(--bor); }
.oco.cheo { border-style: solid; border-color: var(--ac); background: var(--sup); animation: entra .35s; }
.pc { position: absolute; top: 6px; right: 8px; background: var(--ac); color: #fff; border-radius: 8px; padding: 0 8px; font-size: .85rem; }
.frecha .ico { width: 2.2rem; height: 2.2rem; color: var(--ac); }
.nota { text-align: center; color: var(--txt2); font-size: .9rem; margin: 8px 0 14px; }
#pe { display: flex; justify-content: center; margin-top: 16px; }

/* ---------- climograma ---------- */
.taboa { border-collapse: collapse; width: 100%; font-size: .95rem; background: var(--sup); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
.taboa th, .taboa td { padding: 6px 4px; text-align: center; border: 1px solid var(--bor); }
.taboa th.az { color: var(--az); text-align: left; } .taboa th.ve { color: var(--ve); text-align: left; }
.taboa .oc { background: var(--pista-bg); font-weight: 900; }
.climo-wrap { background: var(--sup); border: 1px solid var(--bor); border-radius: var(--r); padding: 14px; }
.modos { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.modos #comprobar { margin-left: auto; }
.az-b:not(.sec) { background: var(--az); } .ve-b:not(.sec) { background: var(--ve); }
.climo { width: 100%; max-height: 58vh; display: block; margin: 8px auto 0; }
.climo .gr { stroke: var(--bor); stroke-width: 1; }
.climo .ex { font-size: 14px; font-weight: 700; } .climo .az { fill: var(--az); } .climo .ve { fill: var(--ve); }
.climo .mes { font-size: 16px; font-weight: 800; fill: var(--txt2); } .climo .mes.oc { fill: var(--pista); }
.climo .barra-c { fill: var(--az); opacity: .85; } .climo .barra-c.tua { opacity: 1; stroke: var(--txt); stroke-width: 2; }
.climo .punto { fill: var(--ve); } .climo .punto.tua { stroke: var(--txt); stroke-width: 2.5; }
.climo .lt { stroke: var(--ve); stroke-width: 3; }
.climo .zona { fill: var(--pista); opacity: .14; cursor: crosshair; } .climo .zona:hover { opacity: .26; } .climo .zona.ok { fill: var(--ok); opacity: .1; cursor: default; }
.climo-preg { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.climo-preg .climo { max-height: 34vh; background: var(--sup); border-radius: 14px; }

/* ---------- mapa ---------- */
.mapa-wrap { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; align-items: start; }
.mapa { width: 100%; display: block; border-radius: var(--r); }
.m-fondo { fill: #d9ecc4; } :root[data-theme="dark"] .m-fondo { fill: #c9dfb2; }
.m-zona { cursor: pointer; } .m-zona:hover { filter: brightness(1.12) drop-shadow(0 0 6px rgba(0,0,0,.35)); }
.m-monte { fill: #8b6f4e; stroke: #4a3a28; stroke-width: 2; stroke-linejoin: round; }
.m-neve { fill: #fff; stroke: #4a3a28; stroke-width: 1.5; }
.m-rio { fill: none; stroke: #2563eb; stroke-width: 12; stroke-linecap: round; } .lenda .m-rio { stroke-width: 5; }
.m-rio-fr { fill: #1e40af; }
.m-vila { fill: #f8fafc; stroke: #334155; stroke-width: 2.5; } .m-casa { fill: #ef4444; }
.m-uva { fill: #7e22ce; } .m-copa { fill: #15803d; } .m-tronco { fill: #78350f; }
.m-lab { font-size: 22px; font-weight: 900; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 5px; }
.m-rosa text { font-size: 20px; font-weight: 900; fill: #111; }
.m-rosa-c { fill: #fff; stroke: #111; stroke-width: 2; } .m-rosa-p { fill: #111; }
.brilla { animation: brilla 1s 3; }
.lenda { list-style: none; margin: 0 0 12px; padding: 12px; background: var(--sup); border: 1px solid var(--bor); border-radius: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: .9rem; font-weight: 700; }
.lenda li { display: flex; align-items: center; gap: 8px; } .lenda svg { width: 2.2rem; height: 1.6rem; flex: none; }
.lenda .lenda-tit { grid-column: 1 / -1; font-weight: 900; letter-spacing: .08em; }
.mapa-dereita .pregunta { font-size: 1.45rem; }

/* ---------- memoria ---------- */
.memoria { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; perspective: 1200px; }
.mcarta { position: relative; aspect-ratio: 3 / 4; transform-style: preserve-3d; transition: transform .45s; }
.mcarta.volta, .mcarta.feita { transform: rotateY(180deg); }
.cara { position: absolute; inset: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; backface-visibility: hidden; padding: 8px; text-align: center; font-weight: 800; }
.cara.tras { background: var(--ac); color: #fff; } .cara.tras .ico { width: 2.6rem; height: 2.6rem; opacity: .7; }
.cara.fronte { transform: rotateY(180deg); background: var(--sup); border: 3px solid var(--bor); }
.cara.fronte.pai { border-color: #15803d; } .cara.fronte.pro { border-color: #d97706; }
.cara small { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--txt2); }
.mcarta.feita .cara.fronte { box-shadow: 0 0 0 4px var(--ok-bg); }

/* ---------- aviso e final ---------- */
.aviso { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 140%); max-width: min(900px, calc(100vw - 32px)); display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 16px; font-weight: 700; font-size: 1.1rem; box-shadow: var(--sombra); transition: transform .3s; z-index: 10; }
.aviso.on { transform: translate(-50%, 0); }
.aviso.ok { background: var(--ok-bg); color: var(--ok); border: 2px solid var(--ok); }
.aviso.mal { background: var(--mal-bg); color: var(--mal); border: 2px solid var(--mal); }
.aviso.pista { background: var(--pista-bg); color: var(--pista); border: 2px solid var(--pista); }
.aviso .ico { width: 1.6rem; height: 1.6rem; }
.final { text-align: center; padding: 30px 0; }
.final h2 { font-size: 2rem; margin: 10px 0; } .final p { font-size: 1.2rem; color: var(--txt2); }
.final .accions { justify-content: center; margin-top: 24px; }
.estrelas .ico { width: 5rem; height: 5rem; color: var(--bor); } .estrelas .ico.enc { color: #f59e0b; fill: #f59e0b; animation: entra .5s backwards; }
.estrelas .ico:nth-child(2) { animation-delay: .2s; } .estrelas .ico:nth-child(3) { animation-delay: .4s; }
.erro { text-align: center; padding: 40px; color: var(--mal); font-weight: 800; }

/* ---------- animacións ---------- */
.abanea { animation: abanea .4s; }
@keyframes abanea { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
@keyframes entra { from { transform: scale(.6); opacity: 0; } }
@keyframes brilla { 50% { filter: drop-shadow(0 0 14px #facc15) brightness(1.3); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- tableta e móbil ---------- */
@media (max-width: 1000px) {
  .areas, .mapa-wrap { grid-template-columns: 1fr; }
  .grupos.g5 { grid-template-columns: repeat(3, 1fr); }
  .memoria { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 640px) {
  .tiles, .grupos.g5 { grid-template-columns: 1fr 1fr; }
  .clave { grid-template-columns: 1fr; justify-items: center; }
  .memoria { grid-template-columns: repeat(3, 1fr); }
  .progreso { display: none; }
  .carta { width: 7.5rem; } .pic { width: 3.6rem; height: 3.6rem; }
  .taboa { font-size: .7rem; }
}

const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const ico = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${D.iconas[n] || ''}</svg>`;
const pic = (clave, cls = '') => clave ? `<i class="pic p-${esc(clave)} ${cls}" aria-hidden="true"></i>` : '';

/* ---------- decisión didáctica: que pasa ao fallar ----------
   item     → o que se estaba a responder (ser vivo, pregunta, mes do climograma…)
   intentos → cantas veces se fallou ESE item ata agora (1 no primeiro fallo)
   Devolve 'reintentar' (só se avisa), 'pista' (aparece a pista do item) ou 'solucion'
   (o xogo pon a resposta correcta e explícaa). Vale para todos os xogos menos as parellas. */
function trasErro(item, intentos) {
  // 1º fallo: pista para que pense; 2º fallo: solución explicada para que non se bloquee
  return intentos === 1 ? 'pista' : 'solucion';
}

/* ---------- tema e pantalla completa ---------- */
function lerTema() { try { return localStorage.getItem('xogos-tema'); } catch (e) { return null; } }
function gardarTema(t) { try { localStorage.setItem('xogos-tema', t); } catch (e) { /* sen almacenamento: non pasa nada */ } }
function aplicarTema(t) {
  document.documentElement.dataset.theme = t;
  const b = document.getElementById('btn-tema');
  if (b) { b.innerHTML = ico(t === 'dark' ? 'moon' : 'sun'); b.title = t === 'dark' ? 'Modo claro' : 'Modo escuro'; }
}
function alternarTema() { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; aplicarTema(t); gardarTema(t); }
function pantallaCompleta() {
  try {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  } catch (e) { /* algúns navegadores non o permiten */ }
}

/* ---------- partida: contador común ---------- */
class Partida {
  constructor(xogo, total) { this.xogo = xogo; this.total = total; this.feitos = 0; this.primeira = 0; this.erros = 0; this.marxe = 1; this.intentos = new Map(); }
  fallo(clave) { this.erros++; const n = (this.intentos.get(clave) || 0) + 1; this.intentos.set(clave, n); return n; }
  acerto(clave) { this.feitos++; if (!this.intentos.get(clave)) this.primeira++; }
  estrelas() { const r = this.erros / Math.max(1, this.total * this.marxe); return r <= 0.25 ? 3 : r <= 0.75 ? 2 : 1; }
}

/* ---------- marco dun xogo ---------- */
function marco(x) {
  document.body.style.setProperty('--ac', D.acentos[`${x.area}${x.ud}`]);
  $app.innerHTML = `
    <header class="barra">
      <button class="btn-ico" id="btn-casa" title="Todos os xogos">${ico('house')}</button>
      <div class="barra-tit"><span class="chip">${x.area === 'CCNN' ? 'Natureza' : 'Sociais'} · UD ${x.ud}</span><h1>${esc(x.titulo)}</h1></div>
      <div class="progreso" aria-label="progreso"><div id="prog"></div></div>
      <button class="btn-ico" id="btn-tema"></button>
      <button class="btn-ico" id="btn-pc" title="Pantalla completa">${ico('maximize')}</button>
    </header>
    <p class="consigna">${esc(x.consigna)}</p>
    <main id="xogo"></main>
    <div id="aviso" class="aviso" role="status" aria-live="polite"></div>`;
  document.getElementById('btn-casa').onclick = portada;
  document.getElementById('btn-tema').onclick = alternarTema;
  document.getElementById('btn-pc').onclick = pantallaCompleta;
  aplicarTema(document.documentElement.dataset.theme);
  return document.getElementById('xogo');
}
function progreso(p) { const b = document.getElementById('prog'); if (b) b.style.width = `${Math.round(100 * p.feitos / p.total)}%`; }

let avisoT;
function aviso(tipo, html) {
  const a = document.getElementById('aviso');
  if (!a) return;
  a.className = `aviso on ${tipo}`;
  a.innerHTML = `${ico(tipo === 'ok' ? 'check' : tipo === 'pista' ? 'lightbulb' : 'x')}<span>${html}</span>`;
  clearTimeout(avisoT);
  avisoT = setTimeout(() => a.classList.remove('on'), tipo === 'mal' ? 2200 : 4200);
}
function abanear(nodo) { if (!nodo) return; nodo.classList.remove('abanea'); void nodo.offsetWidth; nodo.classList.add('abanea'); }

function final(p, volver) {
  const n = p.estrelas();
  const frase = ['', 'Segue practicando: a próxima sae mellor!', 'Moi ben! Xa case o dominas.', 'Perfecto! Es un/unha científico/a!'][n];
  const z = document.getElementById('xogo');
  document.querySelector('.consigna').textContent = '';
  z.innerHTML = `
    <section class="final">
      <div class="estrelas">${[1, 2, 3].map((i) => ico('star', i <= n ? 'enc' : '')).join('')}</div>
      <h2>${frase}</h2>
      <p>${p.xogo.tipo === 'parellas' ? `Atopaches as <b>${p.total}</b> parellas con <b>${p.erros}</b> ${p.erros === 1 ? 'fallo' : 'fallos'}.` : `Acertaches <b>${p.primeira}</b> de <b>${p.total}</b> á primeira.`}</p>
      <div class="accions">
        <button class="btn grande" id="outra">${ico('rotate-ccw')} Xogar outra vez</button>
        <button class="btn grande sec" id="volver">${ico('house')} Outros xogos</button>
      </div>
    </section>`;
  document.getElementById('outra').onclick = volver;
  document.getElementById('volver').onclick = portada;
}

/* --- clasificar: tocar un ítem e despois o seu grupo --- */
function xClasificar(x) {
  const z = marco(x);
  const itens = baralla(Object.entries(x.por_grupo).flatMap(([g, n]) => baralla(x.itens.filter((i) => i.grupo === g)).slice(0, n)));
  const p = new Partida(x, itens.length);
  let sel = null;
  z.innerHTML = `
    <div class="bandexa" id="band">${itens.map((it, i) => `
      <button class="carta" data-i="${i}">${pic(it.picto)}<span>${esc(it.nome)}</span></button>`).join('')}</div>
    <div class="grupos g${x.grupos.length}">${x.grupos.map((g) => `
      <button class="grupo ${g.cor || ''}" data-g="${g.id}">
        <span class="g-tit">${pic(g.picto, 'mini')}${esc(g.nome)}</span><span class="g-dentro"></span></button>`).join('')}</div>`;
  const cartas = [...z.querySelectorAll('.carta')];
  cartas.forEach((c) => c.onclick = () => { cartas.forEach((o) => o.classList.remove('sel')); sel = +c.dataset.i; c.classList.add('sel'); });
  const colocar = (i, ok) => {
    const it = itens[i], c = cartas[i];
    c.classList.add('feito'); c.disabled = true; sel = null;
    z.querySelector(`[data-g="${it.grupo}"] .g-dentro`).append(el(`<span class="mini-carta">${pic(it.picto, 'mini')}${esc(it.nome)}</span>`));
    p.acerto(it.nome); progreso(p);
    const g = x.grupos.find((o) => o.id === it.grupo);
    aviso(ok ? 'ok' : 'pista', `${ok ? 'Ben!' : 'Era'} <b>${esc(it.nome)}</b> → ${esc(g.nome)}. ${esc(it.porque || g.pista)}`);
    if (p.feitos === p.total) setTimeout(() => final(p, () => xClasificar(x)), 1600);
  };
  z.querySelectorAll('.grupo').forEach((b) => b.onclick = () => {
    if (sel === null) { aviso('pista', 'Primeiro toca un ser ou unha acción de arriba.'); return; }
    const it = itens[sel];
    if (b.dataset.g === it.grupo) return colocar(sel, true);
    const n = p.fallo(it.nome), acc = trasErro(it, n);
    abanear(cartas[sel]);
    if (acc === 'solucion') return colocar(sel, false);
    const g = x.grupos.find((o) => o.id === it.grupo);
    if (acc === 'pista') aviso('pista', `Pista: ${esc(g.pista)}`);
    else aviso('mal', 'Non é ese grupo. Proba outra vez!');
  });
  progreso(p);
}

/* --- clave dicotómica: responder si/non sobre un ser misterioso --- */
function xClave(x) {
  const z = marco(x);
  // camiño correcto ata cada folla: {nome: {nodo: 'si'|'non'}}
  const camiño = {};
  (function percorrer(id, ruta) {
    const n = x.nodos[id];
    if (!n) { camiño[id] = ruta; return; }
    percorrer(n.si, { ...ruta, [id]: 'si' });
    percorrer(n.non, { ...ruta, [id]: 'non' });
  })(x.inicio, {});
  const seres = baralla(x.seres).slice(0, x.rondas);
  const p = new Partida(x, seres.length);
  let r = 0;
  const ronda = () => {
    const s = seres[r]; let nodo = x.inicio, fallou = false; const feitas = [];
    const pintar = () => {
      const n = x.nodos[nodo];
      z.innerHTML = `
        <div class="clave">
          <div class="misterio">${pic(s.picto, 'xl')}<span>${n ? 'Ser misterioso ' + (r + 1) + ' de ' + seres.length : esc(s.nome)}</span></div>
          <div class="clave-dereita">
            <ol class="ruta">${feitas.map((f) => `<li>${esc(f.q)} <b class="${f.r}">${f.r.toUpperCase()}</b></li>`).join('')}</ol>
            ${n ? `<div class="pregunta">${esc(n.pregunta)}</div>
              <div class="accions"><button class="btn grande si" data-r="si">${ico('check')} SI</button>
              <button class="btn grande non" data-r="non">${ico('x')} NON</button></div>`
            : `<div class="resolto">É ${/a$/.test(s.nome) ? 'unha' : 'un'} <b>${esc(s.nome)}</b>!<small>Grupo: ${esc(s.grupo)}</small></div>
              <button class="btn grande" id="seg">${r + 1 < seres.length ? 'Seguinte ser' : 'Rematar'} ${ico('arrow-right')}</button>`}
          </div>
        </div>`;
      if (!n) {
        // os fallos gárdanse por pregunta (s.nome+nodo): aquí cóntase o ser enteiro
        if (!fallou) p.primeira++;
        p.feitos++; progreso(p);
        z.querySelector('#seg').onclick = () => (++r < seres.length ? ronda() : final(p, () => xClave(x)));
        return;
      }
      z.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => {
        const ok = camiño[s.nome][nodo];
        if (b.dataset.r === ok) { feitas.push({ q: n.pregunta, r: ok }); nodo = n[ok]; return pintar(); }
        fallou = true;
        const k = s.nome + nodo, acc = trasErro({ ...s, pregunta: n.pregunta }, p.fallo(k));
        abanear(b);
        if (acc === 'solucion') { aviso('pista', `Mira ben: a resposta é <b>${ok.toUpperCase()}</b>.`); feitas.push({ q: n.pregunta, r: ok }); nodo = n[ok]; return setTimeout(pintar, 1200); }
        if (acc === 'pista') aviso('pista', 'Pista: mira o debuxo con atención e pensa como é ese ser no souto.');
        else aviso('mal', 'Mira outra vez o debuxo!');
      });
    };
    pintar();
  };
  ronda(); progreso(p);
}

/* --- cadea alimentaria: tocar os elos en orde --- */
function xCadea(x) {
  const z = marco(x);
  const cadeas = baralla(x.cadeas).slice(0, 4);
  const p = new Partida(x, cadeas.length);
  let r = 0;
  const ronda = () => {
    const c = cadeas[r]; let pos = 0, fallou = false;
    const orde = baralla(c.elos.map((e, i) => ({ ...e, i })));
    z.innerHTML = `
      <p class="lugar">Cadea <b>${esc(c.lugar)}</b> · ${r + 1} de ${cadeas.length}</p>
      <div class="ocos">${c.elos.map((_, i) => `${i ? `<span class="frecha">${ico('arrow-right')}</span>` : ''}<div class="oco" data-o="${i}"><span>${i + 1}</span></div>`).join('')}</div>
      <p class="nota">A frecha quere dicir «é comido por».</p>
      <div class="bandexa">${orde.map((e) => `<button class="carta" data-i="${e.i}">${pic(e.picto)}<span>${esc(e.nome)}</span></button>`).join('')}</div>
      <div id="pe"></div>`;
    const pon = (i) => {
      const e = c.elos[i];
      z.querySelector(`[data-i="${i}"]`).classList.add('feito');
      z.querySelector(`[data-i="${i}"]`).disabled = true;
      z.querySelector(`[data-o="${pos}"]`).innerHTML = `${pic(e.picto)}<span>${esc(e.nome)}</span><b class="pc">${pos ? 'C' : 'P'}</b>`;
      z.querySelector(`[data-o="${pos}"]`).classList.add('cheo');
      if (++pos === c.elos.length) {
        if (!fallou) p.primeira++;
        p.feitos++; progreso(p);
        aviso('ok', esc(x.explica));
        z.querySelector('#pe').innerHTML = `<button class="btn grande" id="seg">${r + 1 < cadeas.length ? 'Seguinte cadea' : 'Rematar'} ${ico('arrow-right')}</button>`;
        z.querySelector('#seg').onclick = () => (++r < cadeas.length ? ronda() : final(p, () => xCadea(x)));
      }
    };
    z.querySelectorAll('.bandexa .carta').forEach((b) => b.onclick = () => {
      const i = +b.dataset.i;
      if (i === pos) return pon(i);
      fallou = true;
      const acc = trasErro(c.elos[pos], p.fallo(`${r}-${pos}`));
      abanear(b);
      if (acc === 'solucion') { aviso('pista', `Tocaba <b>${esc(c.elos[pos].nome)}</b>.`); return pon(pos); }
      if (acc === 'pista') aviso('pista', pos === 0 ? 'Pista: o primeiro é o produtor, unha planta que fabrica o seu alimento.' : `Pista: quen come ${esc(c.elos[pos - 1].nome)}?`);
      else aviso('mal', pos === 0 ? 'Ese non é o produtor.' : `Ese non come ${esc(c.elos[pos - 1].nome)}.`);
    });
  };
  ronda(); progreso(p);
}

/* --- climograma: marcar barras e puntos dos meses ocultos --- */
function xClimograma(x) {
  const z = marco(x);
  const C = D.clima, L = C[x.lugar], E = x.escala;
  const ocultos = baralla([...Array(12).keys()]).slice(0, x.ocultos).sort((a, b) => a - b);
  const marca = Object.fromEntries(ocultos.map((m) => [m, { p: null, t: null, ok: false }]));
  const p = new Partida(x, ocultos.length + x.preguntas.length);
  let modo = 'p';
  // xeometría do gráfico
  const W = 720, H = 400, X0 = 60, X1 = 660, Y0 = 360, Y1 = 30, cw = (X1 - X0) / 12;
  const yP = (v) => Y0 - (v / E.chuvia) * (Y0 - Y1), yT = (v) => Y0 - (v / E.temperatura) * (Y0 - Y1);
  const grafico = (lugar, todo) => {
    const d = C[lugar]; let s = '';
    for (let i = 0; i <= E.linas; i++) {
      const y = Y0 - i * (Y0 - Y1) / E.linas;
      s += `<line x1="${X0}" x2="${X1}" y1="${y}" y2="${y}" class="gr"/>`;
      if (i % 2 === 0) s += `<text x="${X0 - 8}" y="${y + 5}" class="ex az" text-anchor="end">${i * E.chuvia / E.linas}</text><text x="${X1 + 8}" y="${y + 5}" class="ex ve">${i * E.temperatura / E.linas}</text>`;
    }
    s += `<text x="${X0 - 8}" y="18" class="ex az" text-anchor="end">l/m²</text><text x="${X1 + 8}" y="18" class="ex ve">°C</text>`;
    const pts = [];
    C.meses.forEach((m, i) => {
      const cx = X0 + cw * i + cw / 2, oc = !todo && marca[i];
      const pv = oc ? oc.p : d.p[i], tv = oc ? oc.t : d.t[i];
      if (pv !== null) s += `<rect x="${cx - cw * 0.32}" y="${yP(pv)}" width="${cw * 0.64}" height="${Y0 - yP(pv)}" class="barra-c ${oc ? 'tua' : ''}"/>`;
      if (tv !== null) { s += `<circle cx="${cx}" cy="${yT(tv)}" r="8" class="punto ${oc ? 'tua' : ''}"/>`; pts.push([cx, yT(tv)]); } else pts.push(null);
      s += `<text x="${cx}" y="${Y0 + 26}" class="mes ${oc ? 'oc' : ''}" text-anchor="middle">${m}</text>`;
      if (oc) s += `<rect x="${cx - cw / 2}" y="${Y1}" width="${cw}" height="${Y0 - Y1}" class="zona ${oc.ok ? 'ok' : ''}" data-m="${i}"/>`;
    });
    // liña de temperatura só entre puntos consecutivos postos
    for (let i = 1; i < 12; i++) if (pts[i] && pts[i - 1]) s = `<line x1="${pts[i - 1][0]}" y1="${pts[i - 1][1]}" x2="${pts[i][0]}" y2="${pts[i][1]}" class="lt"/>` + s;
    return `<svg viewBox="0 0 ${W} ${H + 20}" class="climo" role="img" aria-label="Climograma de ${esc(lugar)}">${s}</svg>`;
  };
  const taboa = () => `<table class="taboa"><tr><th></th>${C.meses.map((m, i) => `<th class="${marca[i] ? 'oc' : ''}">${m}</th>`).join('')}</tr>
    <tr><th class="az">Chuvia (l)</th>${L.p.map((v, i) => `<td class="${marca[i] ? 'oc' : ''}">${v}</td>`).join('')}</tr>
    <tr><th class="ve">Temp. (°C)</th>${L.t.map((v, i) => `<td class="${marca[i] ? 'oc' : ''}">${v}</td>`).join('')}</tr></table>`;
  const pintar = () => {
    z.innerHTML = `
      ${taboa()}
      <div class="climo-wrap">
        <div class="modos">
          <button class="btn ${modo === 'p' ? '' : 'sec'} az-b" data-modo="p">${ico('chart-column')} Chuvia (barra)</button>
          <button class="btn ${modo === 't' ? '' : 'sec'} ve-b" data-modo="t">● Temperatura (punto)</button>
          <button class="btn grande" id="comprobar">${ico('check')} Comprobar</button>
        </div>
        ${grafico(x.lugar, false)}
        <p class="nota">Toca dentro da columna resaltada á altura do número. Cada liña son ${E.chuvia / E.linas} l ou ${E.temperatura / E.linas} °C.</p>
      </div>`;
    z.querySelectorAll('[data-modo]').forEach((b) => b.onclick = () => { modo = b.dataset.modo; pintar(); });
    z.querySelectorAll('.zona').forEach((r) => r.onpointerdown = (ev) => {
      const m = +r.dataset.m; if (marca[m].ok) return;
      const svg = r.ownerSVGElement, pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const y = pt.matrixTransform(svg.getScreenCTM().inverse()).y;
      const fr = Math.min(1, Math.max(0, (Y0 - y) / (Y0 - Y1)));
      if (modo === 'p') marca[m].p = Math.round(fr * E.chuvia / 5) * 5;
      else marca[m].t = Math.round(fr * E.temperatura);
      pintar();
    });
    z.querySelector('#comprobar').onclick = comprobar;
  };
  const comprobar = () => {
    const mal = [];
    for (const m of ocultos) {
      const k = marca[m]; if (k.ok) continue;
      if (k.p === null || k.t === null) { aviso('pista', `Falta marcar ${k.p === null ? 'a barra' : 'o punto'} de <b>${C.meses[m]}</b>.`); return; }
      if (Math.abs(k.p - L.p[m]) <= x.tolerancia.chuvia && Math.abs(k.t - L.t[m]) <= x.tolerancia.temperatura) { k.ok = true; p.acerto(m); }
      else mal.push(m);
    }
    progreso(p);
    if (!mal.length) { aviso('ok', 'Climograma completo! Agora responde as preguntas.'); return setTimeout(preguntas, 1500); }
    // cada mes mal leva a súa propia conta de intentos
    const acc = Object.fromEntries(mal.map((m) => [m, trasErro({ mes: C.meses[m], p: L.p[m], t: L.t[m] }, p.fallo(m))]));
    const sol = mal.filter((m) => acc[m] === 'solucion'), resto = mal.filter((m) => acc[m] !== 'solucion');
    for (const m of sol) { marca[m] = { p: L.p[m], t: L.t[m], ok: true }; p.acerto(m); }
    progreso(p); pintar();
    if (sol.length) aviso('pista', `Correxido: ${sol.map((m) => `${C.meses[m]} ${L.p[m]} l · ${L.t[m]} °C`).join('; ')}.`);
    else if (resto.some((m) => acc[m] === 'pista')) aviso('pista', `Revisa <b>${resto.map((m) => C.meses[m]).join(', ')}</b>: busca na táboa a chuvia e a temperatura e conta as liñas desde abaixo.`);
    else aviso('mal', `Hai ${resto.length === 1 ? 'un mes' : resto.length + ' meses'} que non coinciden coa táboa: ${resto.map((m) => C.meses[m]).join(', ')}.`);
    if (!resto.length) setTimeout(preguntas, 2500);
  };
  const preguntas = () => {
    let q = 0;
    const unha = () => {
      const pr = x.preguntas[q];
      z.innerHTML = `
        <div class="climo-preg">
          <div>${grafico(x.lugar, true)}<p class="lugar">${esc(x.nome_lugar)}</p></div>
          ${pr.comparar ? `<div>${grafico(pr.comparar, true)}<p class="lugar">${esc(pr.comparar)}</p></div>` : ''}
        </div>
        <div class="pregunta">${esc(pr.texto)}</div>
        <div class="opcions">${baralla(pr.opcions).map((o) => `<button class="btn grande sec" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      z.querySelectorAll('[data-o]').forEach((b) => b.onclick = () => {
        if (b.dataset.o === pr.ok) {
          p.acerto('q' + q); progreso(p); aviso('ok', esc(pr.porque));
          return setTimeout(() => (++q < x.preguntas.length ? unha() : final(p, () => xClimograma(x))), 2200);
        }
        const acc = trasErro(pr, p.fallo('q' + q));
        abanear(b); b.disabled = true;
        if (acc === 'solucion') { p.acerto('q' + q); progreso(p); aviso('pista', `Era <b>${esc(pr.ok)}</b>. ${esc(pr.porque)}`); return setTimeout(() => (++q < x.preguntas.length ? unha() : final(p, () => xClimograma(x))), 3200); }
        if (acc === 'pista') aviso('pista', 'Pista: compara a altura das barras (chuvia) e dos puntos (temperatura).');
        else aviso('mal', 'Non. Mira outra vez o gráfico.');
      });
    };
    unha();
  };
  pintar(); progreso(p);
}

/* --- mapa: tocar lugares no mapa de Valdeorras ou escoller resposta --- */
function mapaSVG(vistos) {
  const lab = (id, x, y, t) => vistos.has(id) ? `<text x="${x}" y="${y}" class="m-lab" text-anchor="middle">${t}</text>` : '';
  const viña = (x, y) => [0, 1, 2].map((f) => [0, 1, 2, 3].map((c) => `<circle cx="${x + c * 12 + (f % 2) * 6}" cy="${y + f * 12}" r="4.5" class="m-uva"/>`).join('')).join('');
  const arbore = (x, y) => `<circle cx="${x}" cy="${y}" r="11" class="m-copa"/><rect x="${x - 2.5}" y="${y + 9}" width="5" height="9" class="m-tronco"/>`;
  return `<svg viewBox="0 0 800 520" class="mapa" role="img" aria-label="Mapa simplificado de Valdeorras">
    <rect x="0" y="0" width="800" height="520" rx="16" class="m-fondo"/>
    <g data-id="montes" class="m-zona"><path d="M90 120 l45 -70 l45 70 z M160 120 l40 -58 l40 58 z M480 110 l42 -62 l42 62 z" class="m-monte"/></g>
    <g data-id="encina" class="m-zona"><path d="M640 300 l38 -62 l38 62 z M690 300 l34 -52 l34 52 z" class="m-monte"/>${lab('encina', 700, 330, 'Enciña da Lastra')}</g>
    <g data-id="trevinca" class="m-zona"><path d="M470 470 l70 -120 l70 120 z" class="m-monte"/><path d="M516 390 l24 -40 l24 40 l-12 -6 l-12 8 l-12 -8 z" class="m-neve"/><path d="M420 470 l45 -70 l45 70 z" class="m-monte"/>${lab('trevinca', 540, 500, 'Pena Trevinca')}</g>
    <g data-id="sil" class="m-zona"><path d="M790 205 C 690 185, 620 245, 520 225 S 330 185, 250 225 S 90 250, 20 228" class="m-rio"/><path d="M20 228 l22 -14 l-4 18 z" class="m-rio-fr"/>${lab('sil', 640, 258, 'río Sil')}</g>
    <g data-id="barco" class="m-zona"><rect x="300" y="170" width="70" height="44" rx="6" class="m-vila"/><path d="M308 186 h14 v14 h-14z M330 180 h14 v20 h-14z M352 188 h12 v12 h-12z" class="m-casa"/>${lab('barco', 335, 160, 'O Barco')}</g>
    <g data-id="vina" class="m-zona">${viña(230, 290)}${viña(420, 130)}${lab('vina', 255, 345, 'viñedo')}</g>
    <g data-id="souto" class="m-zona">${arbore(130, 330)}${arbore(158, 345)}${arbore(140, 362)}${arbore(600, 120)}${arbore(625, 135)}${lab('souto', 145, 400, 'souto')}</g>
    <g class="m-rosa" transform="translate(735 70)"><circle r="44" class="m-rosa-c"/><path d="M0 -38 L9 0 L0 38 L-9 0 Z M-38 0 L0 -9 L38 0 L0 9 Z" class="m-rosa-p"/>
      <text y="-48" text-anchor="middle">N</text><text y="66" text-anchor="middle">S</text><text x="56" y="6" text-anchor="middle">L</text><text x="-56" y="6" text-anchor="middle">O</text></g>
  </svg>`;
}
function lendaMapa() {
  const f = (cls, t) => `<li><svg viewBox="0 0 40 28">${cls}</svg>${t}</li>`;
  return `<ul class="lenda"><li class="lenda-tit">LENDA</li>
    ${f('<path d="M2 18 C 12 8, 26 26, 38 14" class="m-rio"/>', 'río')}
    ${f('<rect x="6" y="6" width="28" height="18" rx="4" class="m-vila"/>', 'vila')}
    ${f('<path d="M6 26 l14 -22 l14 22 z" class="m-monte"/>', 'montaña')}
    ${f('<path d="M6 26 l14 -22 l14 22 z" class="m-monte"/><path d="M14 13 l6 -9 l6 9 z" class="m-neve"/>', 'montaña con neve')}
    ${f('<circle cx="10" cy="10" r="4" class="m-uva"/><circle cx="22" cy="10" r="4" class="m-uva"/><circle cx="16" cy="20" r="4" class="m-uva"/><circle cx="28" cy="20" r="4" class="m-uva"/>', 'viñedo')}
    ${f('<circle cx="20" cy="11" r="9" class="m-copa"/><rect x="18" y="18" width="4" height="8" class="m-tronco"/>', 'souto')}
  </ul>`;
}
function xMapa(x) {
  const z = marco(x);
  const toca = baralla(x.preguntas.filter((q) => q.tipo === 'toca')), escolle = baralla(x.preguntas.filter((q) => q.tipo === 'escolle'));
  const nt = Math.ceil(x.rondas / 2) + 1;
  const pregs = baralla([...toca.slice(0, nt), ...escolle.slice(0, x.rondas - nt)]);
  const p = new Partida(x, pregs.length), vistos = new Set();
  let q = 0;
  const seguinte = () => setTimeout(() => (++q < pregs.length ? unha() : final(p, () => xMapa(x))), 1800);
  const unha = () => {
    const pr = pregs[q];
    z.innerHTML = `
      <div class="mapa-wrap">
        <div class="mapa-caixa">${mapaSVG(vistos)}</div>
        <div class="mapa-dereita">
          ${lendaMapa()}
          <div class="pregunta">${esc(pr.texto)}</div>
          ${pr.tipo === 'escolle' ? `<div class="opcions col">${baralla(pr.opcions).map((o) => `<button class="btn grande sec" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : ''}
        </div>
      </div>`;
    const resposta = (ok, nodo) => {
      if (ok) {
        p.acerto(pr.texto); progreso(p);
        if (pr.tipo === 'toca') vistos.add(pr.ok);
        aviso('ok', pr.tipo === 'toca' ? 'Atopáchelo!' : 'Correcto!');
        return seguinte();
      }
      const acc = trasErro(pr, p.fallo(pr.texto));
      abanear(nodo);
      if (acc === 'solucion') {
        p.acerto(pr.texto); progreso(p);
        if (pr.tipo === 'toca') { vistos.add(pr.ok); z.querySelector('.mapa-caixa').innerHTML = mapaSVG(vistos); z.querySelector(`[data-id="${pr.ok}"]`).classList.add('brilla'); }
        aviso('pista', pr.tipo === 'toca' ? 'Mira: é este!' : `Era <b>${esc(pr.ok)}</b>.`);
        return setTimeout(() => (++q < pregs.length ? unha() : final(p, () => xMapa(x))), 2600);
      }
      if (acc === 'pista') aviso('pista', `Pista: ${esc(pr.pista)}`);
      else aviso('mal', 'Non é aí. Proba outra vez!');
    };
    if (pr.tipo === 'toca') z.querySelectorAll('.m-zona').forEach((g) => g.onclick = () => resposta(g.dataset.id === pr.ok, g));
    else z.querySelectorAll('[data-o]').forEach((b) => b.onclick = () => { const ok = b.dataset.o === pr.ok; if (!ok) b.disabled = true; resposta(ok, b); });
  };
  unha(); progreso(p);
}

/* --- parellas (memoria): paisaxe ↔ produto --- */
function xParellas(x) {
  const z = marco(x);
  const pares = baralla(x.parellas).slice(0, x.por_partida);
  const cartas = baralla(pares.flatMap((par, i) => [{ ...par.paisaxe, par: i, tipo: 'Paisaxe' }, { ...par.produto, par: i, tipo: 'Produto' }]));
  const p = new Partida(x, pares.length);
  p.marxe = 2.5; // na memoria fallar ao principio é inevitable
  let abertas = [], bloqueo = false;
  z.innerHTML = `<div class="memoria">${cartas.map((c, i) => `
    <button class="mcarta" data-i="${i}" aria-label="carta ${i + 1}">
      <span class="cara tras">${ico('grid-2x2')}</span>
      <span class="cara fronte ${c.tipo === 'Paisaxe' ? 'pai' : 'pro'}"><small>${c.tipo}</small>${pic(c.picto)}<span>${esc(c.nome)}</span></span>
    </button>`).join('')}</div>`;
  const bs = [...z.querySelectorAll('.mcarta')];
  bs.forEach((b) => b.onclick = () => {
    const i = +b.dataset.i;
    if (bloqueo || b.classList.contains('volta') || b.classList.contains('feita')) return;
    b.classList.add('volta'); abertas.push(i);
    if (abertas.length < 2) return;
    const [a, c] = abertas; abertas = [];
    if (cartas[a].par === cartas[c].par && cartas[a].tipo !== cartas[c].tipo) {
      bs[a].classList.add('feita'); bs[c].classList.add('feita');
      p.feitos++; progreso(p);
      aviso('ok', `<b>${esc(pares[cartas[a].par].paisaxe.nome)}</b> → ${esc(pares[cartas[a].par].fan)}`);
      if (p.feitos === p.total) setTimeout(() => final(p, () => xParellas(x)), 2600);
    } else {
      p.erros++; bloqueo = true;
      setTimeout(() => { bs[a].classList.remove('volta'); bs[c].classList.remove('volta'); bloqueo = false; }, 1300);
    }
  });
  progreso(p);
}

/* --- quiz de vocabulario: definición → palabra --- */
function xQuiz(x) {
  const z = marco(x);
  const pregs = baralla(x.palabras).slice(0, x.rondas);
  const p = new Partida(x, pregs.length);
  let q = 0;
  const unha = () => {
    const pr = pregs[q];
    const ops = baralla([pr, ...baralla(x.palabras.filter((w) => w !== pr)).slice(0, x.opcions - 1)]);
    z.innerHTML = `
      <p class="lugar">${q + 1} de ${pregs.length}</p>
      <div class="pregunta def">${esc(pr.def)}</div>
      <div class="opcions">${ops.map((o) => `<button class="btn grande sec" data-o="${esc(o.palabra)}">${esc(o.palabra)}</button>`).join('')}</div>`;
    z.querySelectorAll('[data-o]').forEach((b) => b.onclick = () => {
      const seg = () => setTimeout(() => (++q < pregs.length ? unha() : final(p, () => xQuiz(x))), 1700);
      if (b.dataset.o === pr.palabra) { b.classList.add('ben'); p.acerto(pr.palabra); progreso(p); aviso('ok', `Si: <b>${esc(pr.palabra)}</b>.`); return seg(); }
      const acc = trasErro(pr, p.fallo(pr.palabra));
      abanear(b); b.disabled = true;
      if (acc === 'solucion') { z.querySelector(`[data-o="${esc(pr.palabra)}"]`).classList.add('ben'); p.acerto(pr.palabra); progreso(p); aviso('pista', `Era <b>${esc(pr.palabra)}</b>.`); return seg(); }
      if (acc === 'pista') aviso('pista', `Pista: empeza por «${esc(pr.palabra[0])}».`);
      else aviso('mal', 'Non é esa. Le outra vez a definición.');
    });
  };
  unha(); progreso(p);
}

const XOGOS = { clasificar: xClasificar, clave: xClave, cadea: xCadea, climograma: xClimograma, mapa: xMapa, parellas: xParellas, quiz: xQuiz };

/* ---------- portada ---------- */
function portada() {
  document.body.style.removeProperty('--ac');
  const trims = [...new Set(D.xogos.map((x) => x.trimestre))].sort();
  $app.innerHTML = `
    <header class="barra portada-barra">
      <div class="barra-tit"><span class="chip">${esc(D.subtitulo)}</span><h1>${esc(D.titulo)}</h1></div>
      <button class="btn-ico" id="btn-tema"></button>
      <button class="btn-ico" id="btn-pc" title="Pantalla completa">${ico('maximize')}</button>
    </header>
    ${trims.map((t) => `
      <section class="trim"><h2>${t}º trimestre</h2>
        <div class="areas">${['CCNN', 'CCSS'].map((a) => `
          <div class="area"><h3>${a === 'CCNN' ? 'Ciencias da Natureza' : 'Ciencias Sociais'}</h3>
          ${[...new Set(D.xogos.filter((x) => x.trimestre === t && x.area === a).map((x) => x.ud))].map((u) => `
            <div class="ud" style="--ac:${D.acentos[a + u]}"><p class="ud-tit"><b>UD ${u}</b> ${esc(D.uds[a][u])}</p>
              <div class="tiles">${D.xogos.filter((x) => x.trimestre === t && x.area === a && x.ud === u).map((x) => `
                <button class="tile" data-x="${x.id}">${ico(x.icona)}<span>${esc(x.titulo)}</span>${x.reto ? `<small>Reto ${x.reto}</small>` : ''}</button>`).join('')}</div>
            </div>`).join('')}</div>`).join('')}</div>
      </section>`).join('')}
    <footer>Pictogramas: Sergio Palao · ARASAAC (CC BY-NC-SA) · Clima: Open-Meteo (ERA5), media 1995-2024 · Sen rexistro de datos do alumnado</footer>`;
  document.getElementById('btn-tema').onclick = alternarTema;
  document.getElementById('btn-pc').onclick = pantallaCompleta;
  aplicarTema(document.documentElement.dataset.theme);
  $app.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => abrir(b.dataset.x));
  window.scrollTo(0, 0);
}
function abrir(id) {
  const x = D.xogos.find((o) => o.id === id);
  try { XOGOS[x.tipo](x); window.scrollTo(0, 0); }
  catch (e) { console.error(e); $app.innerHTML = `<p class="erro">Este xogo non se puido abrir. Volve á portada.</p>`; setTimeout(portada, 2500); }
}

document.documentElement.dataset.theme = lerTema() || 'dark';
portada();

</script>
