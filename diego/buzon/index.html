<!DOCTYPE html>
<html lang="gl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Buzón de Diego</title>
<style>
/* Lectura privada do buzón: contrasinal (o da Academia), lista de mensaxes e borrar */
:root{--bg:#0e1116;--bg2:#151a21;--card:#171d26;--card2:#1e2632;--tx:#e6ebf2;--tx2:#94a1b2;--tx3:#66717f;--bd:#252e3a;
  --ac:#34d399;--no:#f87171;color-scheme:dark}
:root[data-theme="light"]{--bg:#f5f6f8;--bg2:#fff;--card:#fff;--card2:#f1f3f6;--tx:#161b22;--tx2:#566270;--tx3:#8a94a2;--bd:#e2e6ec;
  --ac:#0f8f5f;--no:#c0392b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.i{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--bg2)}
.b{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);
  background:var(--card);color:var(--tx2);cursor:pointer;text-decoration:none}
h1{font-size:1.05rem;margin:0}
.spacer{flex:1}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:14px}
.porta{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:200px;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit}
button.p{background:var(--ac);color:#06281c;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.msg{color:var(--tx2);font-size:.92rem}
.erro{color:var(--no)}
.m{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.m .cab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.m b{font-size:1rem}
.m small{color:var(--tx3)}
.m p{margin:0;white-space:pre-wrap;word-wrap:break-word}
.m .acc{display:flex;gap:8px;justify-content:flex-end}
.m button{background:none;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;color:var(--tx2);font:inherit;font-size:.85rem;cursor:pointer}
.m button.si{border-color:var(--no);color:var(--no)}
</style>
</head>
<body>
<header>
  <a class="b" href="../index.html" aria-label="Volver"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
  <h1>Buzón de Diego</h1>
  <span class="spacer"></span>
  <button class="b" id="tema" type="button" aria-label="Cambiar tema"></button>
</header>
<main>
  <form class="porta" id="porta">
    <input id="clave" type="password" placeholder="Contrasinal" autocomplete="current-password" aria-label="Contrasinal">
    <button class="p" type="submit">Abrir o buzón</button>
  </form>
  <p class="msg" id="estado">As mensaxes que deixan no teu espazo aparecen aquí, a máis nova primeiro.</p>
  <div id="lista" style="display:flex;flex-direction:column;gap:12px"></div>
</main>
<script>
(function(){
  // tema (ef_theme), igual ca no resto do espazo
  var b=document.getElementById('tema');
  function pon(t){document.documentElement.setAttribute('data-theme',t);
    b.innerHTML=t==='dark'?'<svg class="i" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>'
      :'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    try{localStorage.setItem('ef_theme',t)}catch(e){}}
  var t='dark';try{if(localStorage.getItem('ef_theme')==='light')t='light'}catch(e){}
  pon(t);b.onclick=function(){pon(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')};

  var estado=document.getElementById('estado'), lista=document.getElementById('lista'), clave='';
  try{ clave=sessionStorage.getItem('buzon_diego')||''; }catch(e){}
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  async function cargar(){
    estado.className='msg'; estado.textContent='Abrindo…';
    try{
      var r=await fetch('/api/mensaxe',{headers:{'X-Clave':clave},cache:'no-store'});
      var d=await r.json();
      if(!d.ok){ estado.className='msg erro'; estado.textContent=d.error||'Non se puido abrir.'; return; }
      try{ sessionStorage.setItem('buzon_diego',clave); }catch(e){}
      document.getElementById('porta').style.display='none';
      estado.textContent = d.mensaxes.length ? (d.mensaxes.length+' mensaxe'+(d.mensaxes.length>1?'s':'')) : 'O buzón está baleiro.';
      lista.innerHTML=d.mensaxes.map(function(m){
        var data=m.ts?new Date(m.ts).toLocaleString('gl-ES',{dateStyle:'medium',timeStyle:'short'}):'';
        return '<div class="m" data-id="'+esc(m.id)+'"><div class="cab"><b>'+esc(m.nome)+'</b><small>'+esc(m.contacto||'sen contacto')+' · '+data+'</small></div>'+
               '<p>'+esc(m.texto)+'</p><div class="acc"><button type="button" data-borrar>Borrar</button></div></div>';
      }).join('');
    }catch(e){ estado.className='msg erro'; estado.textContent='Sen conexión co buzón. Proba de novo.'; }
  }

  document.getElementById('porta').addEventListener('submit',function(ev){
    ev.preventDefault(); clave=document.getElementById('clave').value; cargar();
  });
  // Borrar en dous toques (o navegador non mostra confirm): o primeiro pide confirmación no botón
  lista.addEventListener('click',async function(ev){
    var bt=ev.target.closest('[data-borrar]'); if(!bt) return;
    if(!bt.classList.contains('si')){ bt.classList.add('si'); bt.textContent='Seguro? Toca outra vez'; return; }
    var caixa=bt.closest('.m');
    try{
      var r=await fetch('/api/mensaxe?accion=borrar&id='+encodeURIComponent(caixa.getAttribute('data-id')),{method:'POST',headers:{'X-Clave':clave}});
      var d=await r.json(); if(d.ok) caixa.remove(); else bt.textContent=d.error||'Non se puido';
    }catch(e){ bt.textContent='Sen conexión'; }
  });
  if(clave) cargar();
})();
</script>
</body>
</html>
