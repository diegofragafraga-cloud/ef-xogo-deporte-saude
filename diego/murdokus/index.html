<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murdokus · Fichas imprimibles · 6º de Primaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#10b981; --accent-dark:#059669; --accent-soft:#d1fae5;
    --ink:#111827; --soft:#4b5563; --line:#d1d5db; --bg:#f3f4f6;
    --paper:#ffffff; --head:#f3f4f6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:'Nunito',system-ui,-apple-system,sans-serif;}

  /* ---------- Barra de control (non se imprime) ---------- */
  .toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
    padding:12px clamp(14px,3vw,28px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .toolbar h1{margin:0;font-size:1.02rem;display:flex;align-items:center;gap:9px;}
  .toolbar h1 svg{width:22px;height:22px;color:var(--accent);}
  .toolbar h1 small{display:block;font-size:.62rem;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);}
  .tb-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  label.chk{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;
    color:var(--soft);cursor:pointer;user-select:none;}
  label.chk input{width:17px;height:17px;accent-color:var(--accent);}
  .btn{font-family:inherit;font-weight:800;cursor:pointer;border:none;border-radius:11px;
    padding:10px 16px;display:inline-flex;align-items:center;gap:8px;font-size:.9rem;}
  .btn svg{width:18px;height:18px;}
  .btn-print{background:var(--accent);color:#fff;}
  .btn-print:hover{background:var(--accent-dark);}
  .hint{max-width:820px;margin:16px auto -4px;padding:0 14px;color:var(--soft);
    font-weight:700;font-size:.85rem;}

  .pages{max-width:820px;margin:14px auto;padding:0 14px 60px;}

  /* ---------- Folla A4 (deseño pensado para fotocopia en B/N) ---------- */
  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:26px 30px;margin-bottom:22px;box-shadow:0 8px 24px -14px rgba(0,0,0,.4);}
  .sheet.hide{display:none;}
  .s-head{display:flex;align-items:flex-start;gap:12px;border-bottom:3px solid var(--ink);
    padding-bottom:9px;margin-bottom:12px;}
  .s-head .ic{width:34px;height:34px;border:2px solid var(--ink);border-radius:9px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .s-head .ic svg{width:19px;height:19px;}
  .s-head h2{margin:0;font-size:1.18rem;line-height:1.2;}
  .s-head .kicker{font-size:.66rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--soft);}
  .s-head .meta{margin-left:auto;text-align:right;font-size:.72rem;font-weight:800;color:var(--soft);
    white-space:nowrap;line-height:1.5;}

  .nome-data{display:flex;gap:16px;margin-bottom:8px;font-size:.8rem;font-weight:800;color:var(--soft);}
  .nome-data .l{flex:1;border-bottom:1px solid var(--ink);padding-bottom:2px;}
  .nome-data .l.data{flex:0 0 130px;}

  .s-intro{font-weight:700;line-height:1.4;border:1.5px solid var(--ink);border-radius:6px;
    padding:8px 11px;margin-bottom:8px;font-size:.86rem;}
  .block-t{font-weight:900;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink);margin:9px 0 5px;display:flex;align-items:center;gap:7px;}
  .block-t::after{content:"";flex:1;height:1px;background:var(--line);}

  .sus-list{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;}
  .sus-list .it{font-weight:800;font-size:.84rem;display:flex;gap:7px;}
  .sus-list .it small{display:block;font-weight:600;color:var(--soft);font-style:italic;font-size:.72rem;line-height:1.3;}

  /* ---------- Grella de lóxica ---------- */
  table.grid{border-collapse:collapse;table-layout:fixed;width:100%;margin:4px 0;}
  table.grid th,table.grid td{border:1px solid var(--ink);text-align:center;padding:0;}
  table.grid .rowh{width:32%;text-align:left;font-size:.78rem;font-weight:800;padding:4px 7px;
    background:var(--head);}
  table.grid col.opt{width:8.5%;}
  table.grid th.vert{height:64px;vertical-align:bottom;background:var(--head);}
  table.grid th.vert span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;
    font-size:.72rem;font-weight:800;padding:5px 0;}
  table.grid th.grouph{font-size:.64rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;
    background:var(--ink);color:#fff;padding:4px 3px;}
  table.grid th.corner{background:var(--ink);}
  table.grid td.cell{height:26px;}
  table.grid td.dead{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#e5e7eb 4px,#e5e7eb 5px);
    border-color:var(--line);}
  table.grid tr.sep td,table.grid tr.sep th{border-top-width:3px;}

  .howto{font-size:.74rem;color:var(--soft);font-weight:700;margin-top:5px;line-height:1.4;}
  .howto b{color:var(--ink);}

  .clues{counter-reset:pista;}
  .clues li{font-weight:700;line-height:1.35;margin-bottom:2px;font-size:.85rem;}
  .clues ol{margin:2px 0;padding-left:20px;}
  .final{margin-top:7px;border:2px dashed var(--ink);border-radius:6px;padding:7px 10px;
    font-weight:800;font-size:.85rem;}

  .resposta{margin-top:8px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
  .resposta .q{font-weight:900;font-size:.98rem;}
  .resposta .blank{flex:1;min-width:200px;border-bottom:2px solid var(--ink);height:22px;}
  .resposta.col{flex-direction:column;align-items:stretch;gap:2px;margin-top:10px;}
  .resposta.col .q{font-weight:800;font-size:.88rem;}
  .resposta .blank.ancho{width:100%;height:26px;margin-top:8px;}

  table.resumo{border-collapse:collapse;width:100%;margin-top:6px;}
  table.resumo th,table.resumo td{border:1px solid var(--ink);padding:4px 8px;font-size:.8rem;text-align:left;}
  table.resumo th{background:var(--head);font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;}
  table.resumo td{height:22px;}

  /* ---------- Folla de guía ---------- */
  .guide ol{padding-left:20px;margin:6px 0;}
  .guide li{font-weight:700;line-height:1.5;margin-bottom:7px;font-size:.92rem;}
  .guide li b{background:var(--head);padding:1px 5px;border-radius:4px;}
  .demo{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 4px;}
  .demo table{border-collapse:collapse;}
  .demo th,.demo td{border:1px solid var(--ink);width:34px;height:28px;text-align:center;
    font-size:.8rem;font-weight:800;}
  .demo th{background:var(--head);font-size:.68rem;padding:2px 4px;}
  .demo caption{caption-side:bottom;font-size:.72rem;font-weight:700;color:var(--soft);padding-top:5px;}
  .regras{border:1.5px solid var(--ink);border-radius:6px;padding:10px 12px;margin-top:12px;}
  .regras h3{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;}
  .regras ul{margin:0;padding-left:18px;}
  .regras li{font-weight:700;font-size:.86rem;line-height:1.45;margin-bottom:3px;}

  /* ---------- Folla de solución ---------- */
  .sol-list{font-weight:700;line-height:1.6;font-size:.9rem;padding-left:20px;}
  .sol-list li{margin-bottom:5px;}
  .sol-culpable{border:2px solid var(--ink);border-radius:6px;padding:9px 12px;margin:10px 0;
    font-weight:900;font-size:.95rem;}
  .aviso{font-size:.78rem;font-weight:700;color:var(--soft);margin-top:12px;
    border-top:1px dashed var(--line);padding-top:8px;}

  /* ====================== IMPRESIÓN ====================== */
  @media print{
    body{background:#fff;}
    .toolbar,.hint{display:none !important;}
    .pages{max-width:none;margin:0;padding:0;}
    .sheet{border:none;border-radius:0;box-shadow:none;margin:0;padding:12mm 13mm;
      page-break-after:always;}
    .sheet:last-child{page-break-after:auto;}
    @page{size:A4;margin:0;}
  }
</style>
</head>
<body>

<div class="toolbar">
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <span>Murdokus<small>Recuncho tranquilo · 6º</small></span>
  </h1>
  <div class="tb-right">
    <label class="chk"><input type="checkbox" id="chk-guia" checked onchange="render()"> Guía</label>
    <label class="chk"><input type="checkbox" id="chk-ficha" checked onchange="render()"> Ficha</label>
    <label class="chk"><input type="checkbox" id="chk-sol" onchange="render()"> Solución</label>
    <button class="btn btn-print" onclick="window.print()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
      Imprimir
    </button>
  </div>
</div>

<p class="hint">Marca o que queres imprimir. A <b>guía</b> imprímese unha vez e plastifícase no recuncho; a <b>ficha</b>, unha por alumno/a. A <b>solución</b> é só para ti.</p>

<div class="pages" id="pages"></div>

<script src="casos.js"></script>
<script>
// Iconas Lucide inline (nada de emojis)
const ICO = {
  lupa:  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  libro: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>',
  chave: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>',
};

function folla(contido, clase = "") {
  return `<div class="sheet ${clase}">${contido}</div>`;
}

function cabeceira(kicker, titulo, meta, icona) {
  return `<div class="s-head">
    <span class="ic">${icona}</span>
    <div><div class="kicker">${kicker}</div><h2>${titulo}</h2></div>
    ${meta ? `<div class="meta">${meta}</div>` : ""}
  </div>`;
}

/* ---------------- Folla 1 · Guía do recuncho ---------------- */
function follaGuia() {
  const pasos = [
    "Le o misterio e fíxate en <b>quen</b> son os sospeitosos e <b>que categorías</b> hai (onde estivo cada un e que levaba).",
    "Cada persoa ocupa <b>unha soa</b> opción de cada categoría, e ningunha se repite.",
    "Le unha pista e lévaa á táboa: se algo é imposible marca <b>✗</b>; se é seguro marca <b>✓</b>.",
    "Cando poñas un <b>✓</b>, todo o resto da súa fila e da súa columna son <b>✗</b> (coma no sudoku).",
    "Se nunha fila ou nunha columna só queda un oco baleiro, ese oco é un <b>✓</b>.",
    "Non esquezas a parte de abaixo da táboa: alí cruzas <b>o que levaba</b> <b>co lugar</b>. Moitas pistas resólvense aí.",
    "Cando teñas o taboleiro completo, usa a pista final para responder á pregunta.",
  ];
  const demo = `<div class="demo">
    <table>
      <caption>Un ✓ na fila obriga a ✗ no resto</caption>
      <tr><th></th><th>A</th><th>B</th><th>C</th></tr>
      <tr><th>1</th><td>✓</td><td>✗</td><td>✗</td></tr>
      <tr><th>2</th><td>✗</td><td></td><td></td></tr>
      <tr><th>3</th><td>✗</td><td></td><td></td></tr>
    </table>
    <table>
      <caption>Só queda un oco: ten que ser ✓</caption>
      <tr><th></th><th>A</th><th>B</th><th>C</th></tr>
      <tr><th>1</th><td>✗</td><td>✗</td><td>✓</td></tr>
      <tr><th>2</th><td>✗</td><td>✓</td><td>✗</td></tr>
      <tr><th>3</th><td>✓</td><td>✗</td><td>✗</td></tr>
    </table>
  </div>`;
  return folla(
    cabeceira("Recuncho tranquilo", "Como se resolve un murdoku", "Le isto a primeira vez", ICO.libro) +
    `<div class="s-intro">Un murdoku é un misterio que se resolve <b>só con lóxica</b>: non hai que adiviñar nada. Con paciencia e as pistas dá sempre unha única solución.</div>
     <div class="block-t">Paso a paso</div>
     <div class="guide"><ol>${pasos.map(p => `<li>${p}</li>`).join("")}</ol>${demo}</div>
     <div class="regras">
       <h3>Normas do recuncho</h3>
       <ul>
         <li>Vés aquí cando remates a tarefa, sen que che teñan que avisar.</li>
         <li>Traballas en silencio: este é o espazo tranquilo da aula.</li>
         <li>A lapis, para poder borrar cando te trabuques.</li>
         <li>Se te atascas, deixa a ficha e volve a ela outro día: non se pregunta a solución.</li>
         <li>Ao rematar, deixa a ficha na bandexa e a guía no seu sitio.</li>
       </ul>
     </div>`,
    "guide"
  );
}

/* ---------------- Folla 2 · Ficha do caso ---------------- */
function follaCaso(c) {
  const [cat0, cat1] = c.categorias;
  const nOpt = cat0.itens.length;

  const sus = c.sospeitosos
    .map((s, i) => `<div class="it"><span>${i + 1}.</span><div>${s.nome}<small>“${s.declaracion}”</small></div></div>`)
    .join("");

  // Grella en L: filas (sospeitosos + itens da cat1) × columnas (cat0 + cat1)
  const cols = `<colgroup><col style="width:32%"><col span="${nOpt}" class="opt"><col span="${nOpt}" class="opt"></colgroup>`;
  const grupos = `<tr><th class="corner"></th>
      <th class="grouph" colspan="${nOpt}">${cat0.nome}</th>
      <th class="grouph" colspan="${nOpt}">${cat1.nome}</th></tr>`;
  const verticais = `<tr><th class="corner"></th>` +
    cat0.itens.map(i => `<th class="vert"><span>${i.curto}</span></th>`).join("") +
    cat1.itens.map(i => `<th class="vert"><span>${i.curto}</span></th>`).join("") + `</tr>`;

  const filasSus = c.sospeitosos
    .map(s => `<tr><th class="rowh">${s.nome}</th>` + `<td class="cell"></td>`.repeat(nOpt * 2) + `</tr>`)
    .join("");

  // Bloque inferior: itens da cat1 × cat0 (o cruce cat1×cat1 vai inutilizado)
  const filasObx = cat1.itens
    .map((it, k) => `<tr class="${k === 0 ? "sep" : ""}"><th class="rowh">${it.longo}</th>` +
      `<td class="cell"></td>`.repeat(nOpt) + `<td class="dead"></td>`.repeat(nOpt) + `</tr>`)
    .join("");

  const pistas = c.pistas.map(p => `<li>${p.texto}</li>`).join("");

  // Só liñas de resposta: o taboleiro xa recolle a solución completa
  const resposta = `<div class="resposta"><span class="q">${c.pregunta}</span><span class="blank"></span></div>
     <div class="resposta col"><span class="q">Explica nunha frase como o descubriches:</span><span class="blank ancho"></span><span class="blank ancho"></span></div>`;

  return folla(
    cabeceira("Murdoku · 6º de Primaria", c.titulo, `${c.nivel}<br>${c.tempo}`, ICO.chave) +
    `<div class="nome-data"><div class="l">Nome:</div><div class="l data">Data:</div></div>
     <div class="s-intro">${c.intro}</div>
     <div class="block-t">Sospeitosos e o que declaran</div>
     <div class="sus-list">${sus}</div>
     <div class="block-t">Taboleiro de lóxica</div>
     <table class="grid">${cols}${grupos}${verticais}${filasSus}${filasObx}</table>
     <div class="howto">Marca <b>✓</b> cando esteas seguro/a e <b>✗</b> cando sexa imposible. En cada fila e en cada columna só pode haber <b>un ✓</b>.</div>
     <div class="block-t">Pistas</div>
     <div class="clues"><ol>${pistas}</ol></div>
     <div class="final">${c.pistaFinal}</div>
     <div class="block-t">A túa resposta</div>
     ${resposta}`
  );
}

/* ---------------- Folla 3 · Solución (profe) ---------------- */
function follaSolucion(c) {
  const [cat0, cat1] = c.categorias;
  const filas = c.sospeitosos.map((s, i) =>
    `<tr><td>${s.nome}</td><td>${cat0.itens[c.solucion[0][i]].longo}</td><td>${cat1.itens[c.solucion[1][i]].longo}</td></tr>`
  ).join("");

  return folla(
    cabeceira("Só para o profesorado", "Solución · " + c.titulo, c.nivel, ICO.lupa) +
    `<table class="resumo">
       <tr><th>Persoa</th><th>${cat0.nome}</th><th>${cat1.nome}</th></tr>${filas}
     </table>
     <div class="sol-culpable">${c.pregunta} <span style="text-decoration:underline">${c.sospeitosos[c.culpable].nome}</span></div>
     <div class="block-t">Razoamento paso a paso</div>
     <ol class="sol-list">${c.explicacion.map(e => `<li>${e}</li>`).join("")}</ol>
     <div class="aviso">A solución está comprobada por ordenador: é <b>única</b> e ningunha das ${c.pistas.length} pistas sobra (<code>node validar.mjs</code>). Se editas as pistas, volve executalo antes de fotocopiar.</div>`,
    "sol"
  );
}

function render() {
  const c = CASOS[0];
  const partes = [];
  if (document.getElementById("chk-guia").checked)  partes.push(follaGuia());
  if (document.getElementById("chk-ficha").checked) partes.push(follaCaso(c));
  if (document.getElementById("chk-sol").checked)   partes.push(follaSolucion(c));
  document.getElementById("pages").innerHTML = partes.join("");
}

render();
</script>
</body>
</html>
